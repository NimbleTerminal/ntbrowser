version: '3'

env:
  GOWORK: 'off'
  CGO_ENABLED: '0'
  GIT_PAGER: 'cat'

vars:
  EXE: '{{if eq OS "windows"}}.exe{{end}}'
  RACE: '{{if eq OS "darwin"}}-race{{end}}' # needs cgo on Linux
  WASM_PKGS: ./dom ./jsvm ./loop ./netpolicy ./subres ./profile ./content

tasks:
  default:
    desc: Build the library and the ntbrowser binary
    cmds:
      - task: build

  list:
    desc: List available tasks
    cmds:
      - task --list-all

  ci:
    desc: Run formatting, module, test, vet, WASM, notices, build, and fuzz checks
    cmds:
      - task: fmt-check
      - task: go-tidy-check
      - task: go-verify
      - task: check
      - task: build
      - task: build-nocjk
      - task: fuzz

  fmt-check:
    desc: Check Go formatting in both modules without changing files
    cmds:
      - |
        set -eu
        files=$(gofmt -l .)
        if [ -n "$files" ]; then
          printf '%s\n' "$files"
          exit 1
        fi

  go-tidy-check:
    desc: Check dependency files in both modules without changing them
    cmds:
      - go mod tidy -diff
      - go -C cmd/ntbrowser-media mod tidy -diff

  go-verify:
    desc: Verify downloaded dependencies in both modules
    cmds:
      - go mod verify
      - go -C cmd/ntbrowser-media mod verify

  fuzz:
    desc: 'Fuzz DOM parsing and serialization (DURATION=30s)'
    vars:
      DURATION: '{{default "30s" .DURATION}}'
    env:
      NTBROWSER_FUZZ_DURATION: '{{.DURATION}}'
    cmds:
      - go test -mod=readonly -run='^$' -fuzz=FuzzParseSerializeRoundTrip -fuzztime="$NTBROWSER_FUZZ_DURATION" -parallel=2 ./dom/

  build:
    desc: Build everything and the binary into bin/
    cmds:
      - go build -mod=readonly ./...
      - go build -mod=readonly -o bin/ntbrowser{{.EXE}} ./cmd/ntbrowser
      - cd cmd/ntbrowser-media && go build -mod=readonly -o ../../bin/ntbrowser-media{{.EXE}} .

  test:
    desc: Run the test suite under the race detector
    cmds:
      - go test {{.RACE}} -count=1 ./...
      - cd cmd/ntbrowser-media && go test {{.RACE}} -count=1 .

  build-nocjk:
    desc: Build the binary without the CJK fallback face (about 4 MB smaller)
    cmds:
      - go build -mod=readonly -tags nocjk -o bin/ntbrowser-nocjk{{.EXE}} ./cmd/ntbrowser

  test-nocjk:
    desc: Run the loop tests with -tags nocjk
    cmds:
      - go test -count=1 -tags nocjk ./loop

  notices:
    desc: Regenerate THIRD_PARTY_NOTICES.md from the modules the binary links
    cmds:
      - go run ./internal/tools/notices > THIRD_PARTY_NOTICES.md
      - go run ./internal/tools/notices -media > cmd/ntbrowser-media/THIRD_PARTY_NOTICES.md

  notices-check:
    desc: Check generated notices without modifying tracked files
    cmds:
      - mkdir -p dist
      - go run ./internal/tools/notices > dist/THIRD_PARTY_NOTICES.md
      - cmp THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
      - go run ./internal/tools/notices -media > dist/MEDIA_NOTICES.md
      - cmp cmd/ntbrowser-media/THIRD_PARTY_NOTICES.md dist/MEDIA_NOTICES.md

  vet:
    desc: Run go vet in both modules
    cmds:
      - go vet ./...
      - go -C cmd/ntbrowser-media vet ./...

  test-sandbox-linux:
    desc: Run the sandbox tests on a Linux kernel in Docker
    cmds:
      - docker run --rm -v "$PWD":/src -w /src -e GOWORK=off -e CGO_ENABLED=0 --security-opt seccomp=unconfined golang:1.26 go test ./sandbox -count=1

  wasm:
    desc: Compile the sandbox-side packages for js/wasm (compile-only in v1)
    env:
      GOOS: js
      GOARCH: wasm
    cmds:
      - go build {{.WASM_PKGS}}

  check:
    desc: Vet, tests, nocjk, WASM, and dependency notices
    cmds:
      - task: vet
      - task: test
      - task: test-nocjk
      - task: wasm
      - task: notices-check

  run:
    desc: 'Run ntbrowser (task run -- [flags] URL)'
    interactive: true
    cmds:
      - go run ./cmd/ntbrowser {{.CLI_ARGS}}

  release-check:
    desc: Validate release configuration and packaging guards
    cmds:
      - goreleaser check
      - actionlint
      - python3 -m unittest discover -s scripts -p 'test_*.py'

  release:
    desc: Build and verify snapshot archives in dist without publishing
    cmds:
      - goreleaser release --snapshot --clean
      - python3 scripts/release.py verify dist
