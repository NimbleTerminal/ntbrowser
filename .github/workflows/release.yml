name: Release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (for example v0.1.0)
        type: string
        required: true

permissions:
  contents: read
env:
  GOWORK: 'off'
  CGO_ENABLED: '0'
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cmd/ntbrowser-media/go.sum
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.16.0
          args: check
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.16.0
          args: release --snapshot --clean
      - run: python3 scripts/release.py verify dist
      - uses: actions/upload-artifact@v4
        with:
          name: ntbrowser-snapshot
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 7

  prepare:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 scripts/release.py tag "$RELEASE_TAG"
          commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  checks:
    needs: prepare
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}

  release:
    needs: [prepare, checks]
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      # Keep automation separate so a manual dispatch can package an older
      # source tag, including v0.1.0, without moving or modifying that tag.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: source/go.mod
          cache-dependency-path: |
            source/go.sum
            source/cmd/ntbrowser-media/go.sum
      - name: Require release credentials
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          for name in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_ISSUER_ID MACOS_NOTARY_KEY_ID MACOS_NOTARY_KEY HOMEBREW_TAP_GITHUB_TOKEN; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing secret $name"; exit 1; fi
          done
      - name: Extract notes from the tagged changelog
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 tooling/scripts/release.py notes source/CHANGELOG.md "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.16.0
          workdir: source
          args: release --clean --skip=publish --config ../tooling/.goreleaser.yaml
        env:
          GORELEASER_CURRENT_TAG: ${{ needs.prepare.outputs.tag }}
          MEDIA_ENTITLEMENTS: ${{ github.workspace }}/tooling/.goreleaser.media.entitlements.plist
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      - run: python3 tooling/scripts/release.py verify source/dist
      - name: Generate Homebrew cask
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 tooling/scripts/release.py cask source/dist "$RELEASE_TAG" > "$RUNNER_TEMP/ntbrowser.rb"
      - run: ruby -c "$RUNNER_TEMP/ntbrowser.rb"
      - name: Publish checked archives and checksums
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          remote_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$RELEASE_TAG" --jq .sha)
          test "$remote_commit" = "$RELEASE_COMMIT"
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/checksums.txt \
            --verify-tag --title "ntbrowser $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
      - name: Publish stable Homebrew cask
        if: ${{ !contains(needs.prepare.outputs.tag, '-') }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 tooling/scripts/publish_cask.py "$RUNNER_TEMP/ntbrowser.rb" "$RELEASE_TAG"
