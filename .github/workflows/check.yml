name: check
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact source commit to check for a release
        type: string
        required: true
permissions:
  contents: read
env:
  GOWORK: 'off'
  CGO_ENABLED: '0'
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Taskfile selects -race on macOS; Linux builds stay without cgo.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cmd/ntbrowser-media/go.sum
      - uses: go-task/setup-task@v2
        with:
          version: '3.x'
      - run: test -z "$(gofmt -l .)"
      - run: go mod tidy -diff
      - run: go mod tidy -diff
        working-directory: cmd/ntbrowser-media
      - run: task check build build-nocjk
      - run: go vet ./...
        working-directory: cmd/ntbrowser-media
      - run: go test -run='^$' -fuzz=FuzzParseSerializeRoundTrip -fuzztime=30s ./dom/
