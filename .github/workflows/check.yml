name: check
on: [push, pull_request]
env:
  GOWORK: 'off'
  CGO_ENABLED: '0'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: GOOS=js GOARCH=wasm go build ./dom ./jsvm ./loop ./netpolicy
      - run: go test -run='^$' -fuzz=FuzzParseSerializeRoundTrip -fuzztime=30s ./dom/
